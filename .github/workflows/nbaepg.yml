name: Generate NBA EPG

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟更新（你可以改每天一次）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run script
        run: python generate.py

      - name: Commit XML
        run: |
          git config --global user.name "epg-bot"
          git config --global user.email "bot@example.com"
          git add nba_epg.xml
          git commit -m "update epg" || echo "no changes"
          git push
